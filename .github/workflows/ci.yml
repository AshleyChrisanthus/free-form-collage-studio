name: CI & Single-File Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, Test & Single-File Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build single-file production package
        run: npm run build

      - name: Validate single-file distribution
        run: |
          file_count=$(ls -1 dist | wc -l)
          if [ "$file_count" -ne 1 ]; then
            echo "Error: dist directory contains $file_count files instead of exactly 1"
            ls -la dist
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found"
            exit 1
          fi
          # Verify zero external script or link references
          if grep -E 'src="\./|href="\./assets' dist/index.html; then
            echo "Error: dist/index.html contains relative asset references"
            exit 1
          fi
          echo "Single-file bundle validation passed! Size: $(wc -c < dist/index.html) bytes"

      - name: Upload index.html build artifact
        uses: actions/upload-artifact@v4
        with:
          name: collage-studio-singlefile
          path: dist/index.html
          retention-days: 14

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/index.html
          generate_release_notes: true
