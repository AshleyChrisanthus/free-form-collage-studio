<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Free-Form Collage Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='16' height='16' rx='4' fill='%230a84ff'/%3E%3Crect x='14' y='14' width='16' height='16' rx='4' fill='%23ec4899' fill-opacity='.85'/%3E%3C/svg%3E"
    />
    <script>
      // Prevent white flash: apply saved mode before CSS/JS loads.
      try {
        var m = localStorage.getItem('app_theme');
        if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
